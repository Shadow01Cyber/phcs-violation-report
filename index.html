var idx = Math.floor(Math.random() * SUBJECTS.length);

var chRef = randomChannelRef();
var subject = SUBJECTS[idx].replace(/{CH}/g, chRef);

function enc(s){ return encodeURIComponent(s); }
function buildMailto(s,b){ return 'mailto:'+TO+'?subject='+enc(s)+'&body='+enc(b); }
function buildIntent(s,b){
    var d=TO+'?subject='+enc(s)+'&body='+enc(b);
    return 'intent:'+d+'#Intent;scheme=mailto;package=com.google.android.gm;action=android.intent.action.SENDTO;S.browser_fallback_url='+enc('mailto:'+d)+';end';
}

var ua=navigator.userAgent||navigator.vendor||window.opera;
var isA=/android/i.test(ua);

function launchEmail(){
    if(!subject||!body) return;
    if(isA){ window.location.href=buildIntent(subject,body.substring(0,1800)); }
    else{ window.location.href=buildMailto(subject,body.substring(0,1800)); }
}

var manualBtn=document.getElementById('manualBtn');
var hint=document.getElementById('hint');
manualBtn.addEventListener('click',function(){launchEmail();});
