function enc(s){ return encodeURIComponent(s); }

function buildMailto(subject, body){
    return 'mailto:' + TO + '?subject=' + enc(subject) + '&body=' + enc(body);
}

function buildIntent(subject, body){
    var data = TO + '?subject=' + enc(subject) + '&body=' + enc(body);
    var fallback = enc('mailto:' + data);
    return 'intent:' + data + '#Intent;scheme=mailto;package=com.google.android.gm;action=android.intent.action.SENDTO;S.browser_fallback_url=' + fallback + ';end';
}

var ua = navigator.userAgent || navigator.vendor || window.opera;
var isA = /android/i.test(ua);
var isI = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;

function launchEmail(){
    if(!subject || !body) return;
    if(isA){
        window.location.href = buildIntent(subject, body.substring(0, 1800));
    } else {
        window.location.href = buildMailto(subject, body.substring(0, 1800));

}
